name: ULTRA17 recover test logs
'on':
  push:
    branches:
    - build/ultra-17-logs
permissions:
  contents: read
  actions: read
concurrency:
  group: ultra17-log-recovery
  cancel-in-progress: false
jobs:
  recover:
    if: ${{ github.repository == 'alexximo119-hub/TelegaULTRA-Public' && github.ref
      == 'refs/heads/build/ultra-17-logs' && github.actor == github.repository_owner
      }}
    runs-on: xcode-27
    timeout-minutes: 30
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        persist-credentials: 'false'
    - name: Prepare logs
      run: mkdir -p private-logs
    - name: Install age
      run: python3 scripts/install_age.py
    - name: Download original encrypted simulator artifact
      uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
      with:
        name: ULTRA-simulator-42921732705
        path: sealed-input
        run-id: '42921732705'
        github-token: ${{ github.token }}
    - name: Restore privately
      env:
        ULTRA_ARTIFACT_IDENTITY: ${{ secrets.ULTRA_ARTIFACT_IDENTITY }}
      run: python3 scripts/sealed_artifacts.py open --input sealed-input/simulator.zip.age
        --output restored --identity-env ULTRA_ARTIFACT_IDENTITY > private-logs/restore.log
        2>&1
    - name: Seal only test journals
      run: python3 scripts/sealed_artifacts.py seal --include restored/private-logs
        --recipient ci/artifact-recipient.txt --output sealed/test-logs.zip.age
    - name: Upload encrypted journals
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
      with:
        name: ULTRA17-test-logs
        path: sealed/test-logs.zip.age
        retention-days: 1
        if-no-files-found: error
        compression-level: 0
