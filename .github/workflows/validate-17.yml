name: ULTRA17 Postbox and startup validation
'on':
  push:
    branches:
    - build/ultra-17-validation
permissions:
  contents: read
  actions: read
concurrency:
  group: ultra17-test-validation
  cancel-in-progress: false
env:
  ULTRA_BUILD_NUMBER: '17'
jobs:
  validate:
    if: ${{ github.repository == 'alexximo119-hub/TelegaULTRA-Public' && github.ref
      == 'refs/heads/build/ultra-17-validation' && github.actor == github.repository_owner
      }}
    runs-on: xcode-27
    timeout-minutes: 120
    defaults:
      run:
        shell: bash
    steps:
    - name: Checkout ULTRA build files
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        persist-credentials: 'false'
    - name: Prepare private logs
      run: 'mkdir -p private-logs

        [[ "$ULTRA_BUILD_NUMBER" =~ ^[1-9][0-9]{0,3}$ ]]'
    - name: Checkout pinned official source
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        repository: TelegramMessenger/Telegram-iOS
        ref: 24638bc69bd083981b178dd1e7f921eebbf7fc46
        path: source
        submodules: recursive
        persist-credentials: 'false'
    - name: Set Python
      uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
      with:
        python-version: '3.13'
    - name: Install checksum-pinned age
      run: python3 scripts/install_age.py
    - name: Check toolchain and capacity
      run: 'set -euo pipefail

        XCODE_VERSION=$(python3 -c ''import json; print(json.load(open("source/versions.json"))["xcode"])'')

        sudo xcode-select -s "/Applications/Xcode_${XCODE_VERSION}.app/Contents/Developer"

        xcodebuild -version

        python3 --version

        df -h .

        sysctl hw.memsize hw.ncpu

        '
    - name: Apply ULTRA and configure unsigned build
      env:
        TELEGRAM_API_ID: ${{ secrets.TELEGRAM_API_ID }}
        TELEGRAM_API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
      run: '{

        python3 scripts/prepare_source.py --source source

        } > "$GITHUB_WORKSPACE/private-logs/apply-ultra-and-configure-unsigned-build.log"
        2>&1

        '
    - name: Verify native Postbox regressions
      working-directory: source
      run: "set -euo pipefail\npython3 ../scripts/run_private_step.py \\\n  --label\
        \ simulator \\\n  --log \"$GITHUB_WORKSPACE/private-logs/native-postbox-tests.log\"\
        \ \\\n  -- python3 -u build-system/Make/Make.py test \\\n  --configurationPath=build-input/ultra-configuration.json\
        \ \\\n  --unsigned --target=//submodules/Postbox:PostboxTests\n"
    - name: Download compiled simulator
      uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
      with:
        name: ULTRA-simulator-42921732705
        path: sealed-input
        run-id: '42921732705'
        github-token: ${{ github.token }}
    - name: Restore compiled simulator privately
      env:
        ULTRA_ARTIFACT_IDENTITY: ${{ secrets.ULTRA_ARTIFACT_IDENTITY }}
      run: python3 scripts/sealed_artifacts.py open --input sealed-input/simulator.zip.age
        --output restored --identity-env ULTRA_ARTIFACT_IDENTITY > private-logs/restore.log
        2>&1
    - name: Install screen recognition tool
      env:
        HOMEBREW_NO_AUTO_UPDATE: '1'
      run: 'brew install tesseract

        tesseract --version

        '
    - name: Verify complete client startup
      run: python3 scripts/check_full_startup.py restored/artifacts/simulator/Telegram.ipa
        > private-logs/full-startup.log 2>&1
    - name: Encrypt verification evidence
      if: always()
      run: python3 scripts/sealed_artifacts.py seal --include artifacts --include
        private-logs --recipient ci/artifact-recipient.txt --output sealed/verification.zip.age
    - name: Upload encrypted verification evidence
      if: always()
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
      with:
        name: ULTRA17-validation
        path: sealed/verification.zip.age
        retention-days: 1
        compression-level: 0
        if-no-files-found: error
